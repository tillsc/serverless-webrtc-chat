<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title> CREATE WebRTC channel </title>
  <link href="noserv.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="src/connector.js"></script>
</head>

<body>
  <h2> CREATE WebRTC channel <span id="status"> init </span></h2>
  <p><label><input type="checkbox" id="strip-candidates"> Smaller QR code (experimental)</label></p>
  <h3> 1. Share this code with your partner <button id="copy-offer">Copy</button></h3>
  <textarea id="creater-sdp" readonly></textarea>
  <h3> 2. Paste your partner's reply code <button id="accept-answer">Accept answer</button></h3>
  <textarea id="joiner-sdp" placeholder="Paste your partner's reply code here"></textarea>
  <h3> CHAT </h3>
  <div id="chat">
    <div id="chat-screen-wp">
      <div id="chat-screen"></div>
    </div>
    <div id="ct"><input id="msg" disabled><button id="send" disabled>send</button></div>
  </div>
  <rtc-connector debug></rtc-connector>
  <div id="qrcode"></div>
  <div id="reader" width="100%"></div>
  <script>
    const connector = document.querySelector('rtc-connector');

    connector.addEventListener("opened", () => {
      qrcode.clear();
      document.querySelectorAll("textarea").forEach(t => t.disabled = true);
      document.getElementById("msg").disabled = false;
      document.getElementById("send").disabled = false;
      addMSG("CONNECTED!", "info")
    });

    connector.addEventListener("message", (e) => addMSG(e.detail.message, "other"));

    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 750, height: 750, correctLevel: QRCode.CorrectLevel.L });

    let lastLocalDescription = null;

    async function renderOfferSDP() {
      if (!lastLocalDescription) return;
      let s = await encodeSDP(lastLocalDescription, { stripUnusedCandidates: document.getElementById("strip-candidates").checked });
      document.getElementById("creater-sdp").value = s;
      qrcode.clear();
      qrcode.makeCode(s);
    }

    connector.addEventListener("localdescriptionchange", (e) => {
      lastLocalDescription = e.detail.localDescription;
      renderOfferSDP();
    });

    document.getElementById("strip-candidates").addEventListener("change", renderOfferSDP);

    const STATUS_LABELS = {
      new: "Waiting for partner...",
      checking: "Connecting...",
      connected: "Connected",
      completed: "Connected",
      disconnected: "Connection lost",
      failed: "Connection failed",
      closed: "Closed",
    };

    connector.addEventListener("iceconnectionstatechange", (e) => {
      document.getElementById("status").textContent = STATUS_LABELS[e.detail.state] || e.detail.state;
      if (e.detail.state === "failed") {
        addMSG("Connection failed - the participant's SDP may have expired. Ask them to send a fresh one.", "error");
      }
    });

    connector.startOffering();

    async function acceptAnswer() {
      let data;
      try {
        data = await decodeSDP(document.getElementById("joiner-sdp").value);
      } catch (err) {
        addMSG("Could not read the participant's SDP - check that you copied the full code.", "error");
        return;
      }
      if (data.type == "answer") {
        qrcode.clear();
        connector.acceptAnswer(data);
      }
      else {
        addMSG("Expected the participant's SDP to be of type 'answer'.", "error");
      }
    }

    var addMSG = function (msg, who) {
      var wrap = document.createElement("div");
      wrap.className = "wrap";
      var div = document.createElement("div");
      div.className = who;
      wrap.appendChild(div);
      var whoSpan = document.createElement("span");
      whoSpan.className = "who";
      whoSpan.textContent = who;
      div.appendChild(whoSpan);
      var msgSpan = document.createElement("span");
      msgSpan.className = "msg";
      msgSpan.textContent = msg;
      div.appendChild(msgSpan);
      var chatScreen = document.getElementById("chat-screen");
      chatScreen.appendChild(wrap);
      document.getElementById("chat-screen-wp").scrollTop = chatScreen.scrollHeight;
    }

    var sendMSG = function () {
      var value = document.getElementById("msg").value;
      if (value) {
        connector.send(value);
        addMSG(value, "me");
        document.getElementById("msg").value = '';
      }
    }
    document.getElementById("copy-offer").addEventListener("click", async () => {
      await navigator.clipboard.writeText(document.getElementById("creater-sdp").value);
      const btn = document.getElementById("copy-offer");
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    });
    document.getElementById("accept-answer").addEventListener("click", () => acceptAnswer());
    document.getElementById("joiner-sdp").addEventListener("paste", () => setTimeout(() => acceptAnswer(), 0));
    document.getElementById("msg").addEventListener("keypress", function (e) { if (e.which == 13) { sendMSG() } });
    document.getElementById("send").addEventListener("click", sendMSG);

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.clear().then(() => {
        document.getElementById("joiner-sdp").value = decodedText;
        acceptAnswer();
      });
    }

    function onScanFailure(error) {
      // handle scan failure, usually better to ignore and keep scanning.
      // for example:
      console.warn(`Code scan error = ${error}`);
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 300, height: 300 } },
  /* verbose= */ false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

  </script>
</body>

</html>
