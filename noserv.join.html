<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title> JOIN WebRTC channel </title>
  <link href="noserv.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="src/connector.js"></script>
</head>

<body>
  <h2> JOIN WebRTC channel <span id="status"> init </span> </h2>
  <p><label><input type="checkbox" id="strip-candidates"> Strip unused ICE candidates (smaller QR code, experimental)</label></p>
  <h3> 2.GET Offer's SDP</h3>
  <textarea id="creater-sdp" placeholder="HERE COPY & PASTE [1.CREATE Offer's SDP]"></textarea>
  <h3> 3.CREATE Participant'S SDP <button id="create">CREATE</button> <span id="answer-countdown"></span></h3>
  <textarea id="joiner-sdp"></textarea>
  <h3> CHAT </h3>
  <div id="chat">
    <div id="chat-screen-wp">
      <div id="chat-screen"></div>
    </div>
    <div id="ct"><input id="msg" disabled><button id="send" disabled>send</button></div>
  </div>
  <rtc-connector debug></rtc-connector>
  <div id="reader" width="100%"></div>
  <div id="qrcode"></div>
  <script>
    const connector = document.querySelector('rtc-connector');

    connector.addEventListener("opened", () => {
      qrcode.clear();
      document.querySelectorAll("textarea").forEach(t => t.disabled = true);
      document.getElementById("msg").disabled = false;
      document.getElementById("send").disabled = false;
      addMSG("CONNECTED!", "info")
      clearInterval(countdownTimer);
      document.getElementById("answer-countdown").textContent = "";
    });

    connector.addEventListener("message", (e) => addMSG(e.detail.message, "other"));

    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 750, height: 750, correctLevel: QRCode.CorrectLevel.L });

    let lastLocalDescription = null;

    // How long an answer stays valid before ICE gives up isn't exposed by any
    // browser API. We measure it ourselves: once a "failed" happens, we know
    // how long that attempt actually lasted, and reuse that as the estimate
    // for the next countdown (this seems to stay fairly constant per browser/network).
    let answerGeneratedAt = null;
    let estimatedValidityMs = null;
    let countdownTimer = null;

    function startCountdown() {
      clearInterval(countdownTimer);
      const el = document.getElementById("answer-countdown");
      if (!estimatedValidityMs) {
        el.textContent = "";
        return;
      }
      countdownTimer = setInterval(() => {
        const remaining = estimatedValidityMs - (Date.now() - answerGeneratedAt);
        if (remaining <= 0) {
          el.textContent = "(likely expired)";
          clearInterval(countdownTimer);
        } else {
          el.textContent = `(valid for ~${Math.ceil(remaining / 1000)}s)`;
        }
      }, 250);
    }

    async function renderAnswerSDP() {
      if (!lastLocalDescription) return;
      let s = await encodeSDP(lastLocalDescription, { stripUnusedCandidates: document.getElementById("strip-candidates").checked });
      document.getElementById("joiner-sdp").value = s;
      qrcode.clear();
      qrcode.makeCode(s);
      answerGeneratedAt = Date.now();
      startCountdown();
    }

    connector.addEventListener("localdescriptionchange", (e) => {
      lastLocalDescription = e.detail.localDescription;
      renderAnswerSDP();
    });

    document.getElementById("strip-candidates").addEventListener("change", renderAnswerSDP);

    connector.addEventListener("iceconnectionstatechange", (e) => {
      document.getElementById("status").textContent = e.detail.state;
      if (e.detail.state === "failed" && answerGeneratedAt) {
        estimatedValidityMs = Date.now() - answerGeneratedAt;
      }
    });

    // offerData lets connector.js's retry pass the original offer directly,
    // instead of relying on the textarea still holding it unchanged.
    async function createAnswerSDP(offerData) {
      const data = offerData || await decodeSDP(document.getElementById("creater-sdp").value);
      if (data.type == 'offer') {
        connector.acceptOfferAndCreateAnswer(data);
      }
      else {
        alert("Expected JSON to be of type 'offer'")
      }
    }

    function sendMSG() {
      var value = document.getElementById("msg").value;
      if (value) {
        connector.send(value);
        addMSG(value, "me");
        document.getElementById("msg").value = '';
      }
    }

    function addMSG(msg, who) {
      var wrap = document.createElement("div");
      wrap.className = "wrap";
      var div = document.createElement("div");
      div.className = who;
      wrap.appendChild(div);
      var whoSpan = document.createElement("span");
      whoSpan.className = "who";
      whoSpan.textContent = who;
      div.appendChild(whoSpan);
      var msgSpan = document.createElement("span");
      msgSpan.className = "msg";
      msgSpan.textContent = msg;
      div.appendChild(msgSpan);
      var chatScreen = document.getElementById("chat-screen");
      chatScreen.appendChild(wrap);
      document.getElementById("chat-screen-wp").scrollTop = chatScreen.scrollHeight;
    }

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById("creater-sdp").value = decodedText;
        createAnswerSDP();
      });
    }

    function onScanFailure(error) {
      // handle scan failure, usually better to ignore and keep scanning.
      // for example:
      console.warn(`Code scan error = ${error}`);
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 300, height: 300 } },
  /* verbose= */ false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    document.getElementById("create").addEventListener("click", () => createAnswerSDP());
    document.getElementById("msg").addEventListener("keypress", function (e) { if (e.which == 13) { sendMSG() } });
    document.getElementById("send").addEventListener("click", sendMSG);
  </script>
</body>

</html>
